# A generic, single database configuration.

[alembic]
# path to migration scripts relative to this file
script_location = alembic

# file naming template for new revisions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path is prepended with this path on startup — lets alembic find app/
prepend_sys_path = .

# timezone for revision timestamps
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# version path separator (os — platform default)
version_path_separator = os

# sqlalchemy.url is intentionally left blank here.
# env.py reads it from app.config.settings (via .env).
# This avoids hard-coding credentials in version control.
sqlalchemy.url =


# ---- logging configuration ----

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
